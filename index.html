<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khảo sát dữ liệu cá nhân — Khoa Dược</title>
<meta name="description" content="Phiếu khai báo hoạt động xử lý dữ liệu cá nhân tại Khoa Dược, Bệnh viện Truyền máu Huyết học.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none !important}

/* Bố cục: một cột, thanh tiến độ dính trên, thanh điều hướng dính dưới,
   nội dung là các khối phẳng viền mảnh. Thiết kế cho điện thoại trước. */
:root{
  --nen:      #eef1f5;
  --mat:      #ffffff;
  --mat-2:    #f7f9fc;
  --vien:     #d4dae3;
  --vien-dam: #b7c0cd;
  --chu:      #11161d;
  --chu-mo:   #5a6775;
  --muc:      #0d4f8b;
  --muc-dam:  #093a68;
  --muc-nhat: #e4eef8;
  --nhan:     #92540a;
  --nhan-nen: #fdf2e0;
  --canh:     #a92a1d;
  --canh-nen: #fceae7;
  --ok:       #11674a;
  --ok-nen:   #e3f2ec;
  --bong:     0 1px 2px rgba(17,22,29,.06), 0 1px 3px rgba(17,22,29,.04);
  color-scheme: light;
  --f-tieu: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-chu:  "Inter", "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --nen:#0e1319; --mat:#171d26; --mat-2:#1d242e; --vien:#2e3843; --vien-dam:#3e4a58;
    --chu:#e9edf2; --chu-mo:#9aa7b6;
    --muc:#6aaef0; --muc-dam:#9ccaf7; --muc-nhat:#13273c;
    --nhan:#e0a44a; --nhan-nen:#2d2415; --canh:#f08b7c; --canh-nen:#2e1a18;
    --ok:#5fc49a; --ok-nen:#14291f;
    --bong: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --nen:#0e1319; --mat:#171d26; --mat-2:#1d242e; --vien:#2e3843; --vien-dam:#3e4a58;
  --chu:#e9edf2; --chu-mo:#9aa7b6;
  --muc:#6aaef0; --muc-dam:#9ccaf7; --muc-nhat:#13273c;
  --nhan:#e0a44a; --nhan-nen:#2d2415; --canh:#f08b7c; --canh-nen:#2e1a18;
  --ok:#5fc49a; --ok-nen:#14291f;
  --bong: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

*{box-sizing:border-box}
body{background:var(--nen);color:var(--chu);font-family:var(--f-chu);
  font-size:16px;line-height:1.62;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--mat)}
h1,h2,h3{font-family:var(--f-tieu);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(1.35rem,5vw,1.75rem);font-weight:700;line-height:1.25}
h2{font-size:clamp(1.1rem,4vw,1.3rem);font-weight:600;line-height:1.3}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button{font-family:inherit;font-size:1rem}
button:not(:disabled){cursor:pointer}
input,textarea,select{font-family:inherit;font-size:1rem}
a{color:var(--muc)}
:focus-visible{outline:2px solid var(--muc);outline-offset:2px;border-radius:4px}

/* ---- thanh tiến độ trên cùng ---- */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--mat);
  border-bottom:1px solid var(--vien)}
.rail-in{max-width:780px;margin:0 auto;padding-block:.7rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:.7rem}
.rail-ten{font-family:var(--f-tieu);font-weight:600;font-size:.9rem;color:var(--chu);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.rail-trangthai{font-size:.78rem;color:var(--chu-mo);font-variant-numeric:tabular-nums;
  white-space:nowrap;flex:0 0 auto}
.thanh{height:6px;background:var(--vien);border-radius:3px;overflow:hidden;flex:1 1 60px;min-width:40px}
.thanh i{display:block;height:100%;background:var(--muc);transition:width .35s cubic-bezier(.4,0,.2,1)}
@media (max-width:480px){ .rail-ten{font-size:.82rem;max-width:9.5rem} }

/* ---- khung nội dung ---- */
.khung{max-width:780px;margin:0 auto;padding-block:1.25rem 1.5rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.nhom{background:var(--mat);border:1px solid var(--vien);border-radius:14px;
  padding:1.15rem 1.15rem 1.3rem;margin-bottom:1rem;box-shadow:var(--bong)}
.nhom > header{margin-bottom:1.15rem}
.nhom > header p{color:var(--chu-mo);font-size:.92rem;margin-top:.3rem}
@media (max-width:560px){ .nhom{padding:1rem .9rem 1.1rem;border-radius:12px} }

.cau{padding-block:1.1rem;border-top:1px solid var(--vien)}
.nhom > header + .cau, .nhom > .cau:first-child{border-top:none;padding-top:0}
.cau-tieu{display:block;font-family:var(--f-tieu);font-weight:600;font-size:1.02rem;
  line-height:1.4;margin-bottom:.2rem}
.vidu{font-size:.88rem;color:var(--chu-mo);margin-bottom:.7rem;line-height:1.55}
.vidu b{font-weight:600;color:var(--chu)}

/* ---- ô nhập ---- */
.o{width:100%;padding:.75rem .85rem;border:1.5px solid var(--vien-dam);border-radius:10px;
  background:var(--mat);color:var(--chu);transition:border-color .15s}
.o::placeholder{color:var(--chu-mo);opacity:.75}
.o:hover{border-color:var(--muc)}
.o:focus{border-color:var(--muc);outline:none;box-shadow:0 0 0 3px var(--muc-nhat)}
textarea.o{min-height:5.5rem;resize:vertical;line-height:1.55}
.hang{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center}
.hang > .o{flex:1 1 10rem;min-width:0}
.so{width:6.5rem;text-align:right;font-variant-numeric:tabular-nums}

/* ---- ô chọn (chip) ---- */
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.45rem;min-height:44px;
  padding:.5rem .9rem;border:1.5px solid var(--vien-dam);border-radius:10px;
  background:var(--mat);color:var(--chu);font-size:.93rem;line-height:1.35;text-align:left;
  transition:border-color .12s, background .12s}
.chip:hover{border-color:var(--muc);background:var(--mat-2)}
.chip .dau{font-weight:700;color:var(--chu-mo);font-size:.95rem;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--muc-nhat);border-color:var(--muc);
  color:var(--muc-dam);font-weight:500}
.chip[aria-pressed="true"] .dau{color:var(--muc)}
.chip.ns[aria-pressed="true"]{background:var(--canh-nen);border-color:var(--canh);color:var(--canh)}
.chip.ns[aria-pressed="true"] .dau{color:var(--canh)}
@media (max-width:420px){ .chip{font-size:.9rem;padding:.5rem .75rem} }

.radio{display:flex;flex-wrap:wrap;gap:.5rem}
.radio button{min-height:44px;padding:.5rem 1.1rem;border:1.5px solid var(--vien-dam);
  border-radius:10px;background:var(--mat);color:var(--chu);font-size:.95rem;transition:all .12s}
.radio button:hover{border-color:var(--muc)}
.radio button[aria-pressed="true"]{background:var(--muc);border-color:var(--muc);color:#fff;font-weight:500}

.khongro{background:none;border:none;color:var(--muc);font-size:.86rem;font-weight:500;
  text-decoration:underline;text-underline-offset:3px;padding:.5rem 0;margin-top:.3rem}

/* ---- hộp nhắc ---- */
.bao{border-left:3px solid var(--nhan);background:var(--nhan-nen);color:var(--chu);
  padding:.75rem .9rem;border-radius:0 10px 10px 0;font-size:.9rem;line-height:1.55;margin-top:.7rem}
.bao.do{border-left-color:var(--canh);background:var(--canh-nen)}
.bao.xanh{border-left-color:var(--ok);background:var(--ok-nen)}
.bao b{font-weight:600}
.bao + .bao{margin-top:.55rem}

/* ---- thẻ chọn việc ---- */
.the{display:grid;gap:.6rem}
.the button{display:block;width:100%;text-align:left;padding:.95rem 1rem;
  border:1.5px solid var(--vien-dam);border-radius:12px;background:var(--mat);color:var(--chu);
  transition:border-color .12s, background .12s}
.the button:hover{border-color:var(--muc);background:var(--mat-2)}
.the .t{font-family:var(--f-tieu);font-weight:600;display:block;line-height:1.4}
.the .m{display:block;font-size:.87rem;color:var(--chu-mo);margin-top:.25rem;line-height:1.5}
.the button[aria-pressed="true"]{border-color:var(--muc);background:var(--muc-nhat);
  box-shadow:inset 4px 0 0 var(--muc)}
.the button[aria-pressed="true"] .m{color:var(--muc-dam)}

/* ---- giải thích thu gọn ---- */
.dieu{margin-top:.7rem;font-size:.88rem}
.dieu summary{cursor:pointer;color:var(--muc);list-style:none;display:inline-flex;
  align-items:center;gap:.4rem;padding:.3rem 0;font-weight:500}
.dieu summary::-webkit-details-marker{display:none}
.dieu summary::before{content:"?";display:inline-grid;place-items:center;width:1.2rem;height:1.2rem;
  border:1.5px solid currentColor;border-radius:50%;font-size:.72rem;font-weight:700}
.dieu p{margin-top:.5rem;color:var(--chu-mo);padding-left:1rem;border-left:2px solid var(--vien);line-height:1.6}

/* ---- nút ---- */
.nut{min-height:48px;padding:.75rem 1.5rem;border-radius:10px;border:1.5px solid var(--muc);
  background:var(--muc);color:#fff;font-weight:600;transition:background .12s}
.nut:hover{background:var(--muc-dam);border-color:var(--muc-dam)}
.nut.phu{background:transparent;color:var(--muc)}
.nut.phu:hover{background:var(--muc-nhat)}
.nut:disabled{opacity:.5}
.nut.lon{font-size:1.02rem}

/* ---- thanh điều hướng dính đáy ---- */
.dieuhuong{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.1rem}
.dieuhuong.chinh{position:sticky;bottom:0;z-index:15;margin:1.25rem -16px 0;
  padding:.8rem max(16px,env(safe-area-inset-left,0px));
  padding-bottom:calc(.8rem + env(safe-area-inset-bottom,0px));
  background:var(--mat);border-top:1px solid var(--vien);flex-wrap:nowrap}
.dieuhuong.chinh .nut{flex:1 1 auto}
.dieuhuong.chinh .nut.phu{flex:0 1 auto;min-width:6.5rem}
@media (min-width:600px){
  .dieuhuong.chinh{position:static;margin:1.25rem 0 0;padding:0;background:none;border-top:none}
  .dieuhuong.chinh .nut{flex:0 0 auto}
}

/* ---- xem lại ---- */
.tomtat{border:1px solid var(--vien);border-radius:12px;overflow:hidden;margin-bottom:.8rem;
  background:var(--mat);box-shadow:var(--bong)}
.tomtat > h3{padding:.8rem 1rem;background:var(--mat-2);color:var(--chu);font-size:.97rem;
  border-bottom:1px solid var(--vien)}
.tomtat dl{margin:0;padding:.7rem 1rem 1rem;display:grid;
  grid-template-columns:minmax(0,10.5rem) minmax(0,1fr);gap:.1rem .9rem}
.tomtat dt{font-size:.83rem;color:var(--chu-mo);padding-top:.5rem}
.tomtat dd{margin:0;padding-top:.5rem;font-size:.92rem;min-width:0;overflow-wrap:anywhere}
@media (max-width:620px){
  .tomtat dl{grid-template-columns:1fr;gap:0}
  .tomtat dt{padding-top:.75rem;font-weight:500}
  .tomtat dd{padding-top:.1rem}
}

.chep{width:100%;min-height:11rem;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
  font-size:.8rem;border:1.5px solid var(--vien-dam);border-radius:10px;padding:.8rem;
  background:var(--mat-2);color:var(--chu);white-space:pre;overflow:auto;line-height:1.5}

.bang{width:100%;border-collapse:collapse;font-size:.88rem}
.bang th,.bang td{border:1px solid var(--vien);padding:.55rem .7rem;text-align:left;vertical-align:top}
.bang th{background:var(--mat-2);font-family:var(--f-tieu);font-weight:600}
.cuon{overflow-x:auto;-webkit-overflow-scrolling:touch}

.chan{margin-top:2rem;padding-top:1.1rem;border-top:1px solid var(--vien);
  font-size:.8rem;color:var(--chu-mo);line-height:1.6}
.lienket{background:none;border:none;color:var(--muc);font-size:.88rem;font-weight:500;
  text-decoration:underline;text-underline-offset:3px;padding:.5rem 0}

@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>

<div class="rail">
  <div class="rail-in">
    <span class="rail-ten">Khảo sát dữ liệu cá nhân &middot; Khoa Dược</span>
    <span class="thanh"><i id="thanh" style="width:0%"></i></span>
    <span class="rail-trangthai" id="trangthai">Chưa bắt đầu</span>
  </div>
</div>

<main class="khung" id="man"></main>

/* ===================== TRẠNG THÁI ===================== */

var KHOA_LUU = "dpia-khoaduoc-v1";
var S = {
  nguoi:{hoTen:"",chucDanh:"",boPhan:""},
  chon:[],
  khac:[],
  phieu:{},
  buoc:0,
  maPhieu:""
};


function taoMa(){
  return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function luu(){
  try{ localStorage.setItem(KHOA_LUU, JSON.stringify(S)); baoLuu(); }catch(e){}
}
function doc(){
  try{
    var r = localStorage.getItem(KHOA_LUU);
    if(r){ var o = JSON.parse(r); if(o && o.nguoi){ S = o; } }
  }catch(e){}
  if(!S.maPhieu) S.maPhieu = taoMa();
}
var hienLuu = null;
function baoLuu(){
  var el = document.getElementById("trangthai");
  if(!el) return;
  var g = new Date();
  var hm = String(g.getHours()).padStart(2,"0") + ":" + String(g.getMinutes()).padStart(2,"0");
  el.textContent = "Đã lưu nháp " + hm;
  clearTimeout(hienLuu);
  hienLuu = setTimeout(veTrangThai, 4000);
}
function veTrangThai(){
  var el = document.getElementById("trangthai");
  if(!el) return;
  var b = cacBuoc();
  el.textContent = S.buoc === 0 ? "Chưa bắt đầu" : ("Bước " + (S.buoc+1) + "/" + b.length);
}

/* ===================== PHIẾU ===================== */

function phieuMoi(viec){
  return {
    ten: viec ? viec.ten : "",
    mucDich: viec ? viec.mucDich : "",
    chuDL: [], soNam:"", soLuu:"",
    treEm:"",
    truong: [],
    nguon: [],
    dongY:"", bieuMau:"",
    noiLuu: [],
    aiXem: [], soNguoi:"",
    trongBV: [], ngoaiBV:"", nuocNgoai:"",
    luuLau:"", luuGhi:"",
    baoVe: [],
    ghiChu:""
  };
}
function layPhieu(id){
  if(!S.phieu[id]){
    var v = null;
    for(var i=0;i<VIEC.length;i++){ if(VIEC[i].id===id) v = VIEC[i]; }
    if(!v){ for(var j=0;j<S.khac.length;j++){ if(S.khac[j].id===id) v = S.khac[j]; } }
    S.phieu[id] = phieuMoi(v);
  }
  return S.phieu[id];
}
function diemNhayCam(p){
  var ra = [], co = {};
  for(var i=0;i<p.truong.length;i++){
    for(var j=0;j<TRUONG.length;j++){
      if(TRUONG[j].t === p.truong[i] && TRUONG[j].ns && !co[TRUONG[j].ns]){
        co[TRUONG[j].ns] = 1; ra.push(TRUONG[j].ns);
      }
    }
  }
  ra.sort();
  return ra;
}

/* ===================== ĐIỀU HƯỚNG ===================== */

function cacBuoc(){
  var b = [{k:"mo"},{k:"nguoi"},{k:"chon"}];
  for(var i=0;i<S.chon.length;i++) b.push({k:"phieu", id:S.chon[i]});
  b.push({k:"xong"});
  return b;
}
function di(n){
  var b = cacBuoc();
  S.buoc = Math.max(0, Math.min(n, b.length-1));
  luu(); ve();
  window.scrollTo({top:0, behavior:"instant"});
}

/* ===================== DỰNG GIAO DIỆN ===================== */

function el(tag, cls, txt){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt != null) e.textContent = txt;
  return e;
}
function nhomMoi(tieu, phu){
  var n = el("section","nhom");
  if(tieu){
    var h = el("header");
    h.appendChild(el("h2", null, tieu));
    if(phu) h.appendChild(el("p", null, phu));
    n.appendChild(h);
  }
  return n;
}
function cauMoi(tieu, vidu){
  var c = el("div","cau");
  c.appendChild(el("div","cau-tieu",tieu));
  if(vidu){
    var v = el("div","vidu");
    v.innerHTML = vidu;
    c.appendChild(v);
  }
  return c;
}
function giaiThich(noiDung){
  var d = el("details","dieu");
  d.appendChild(el("summary", null, "Vì sao hỏi câu này"));
  d.appendChild(el("p", null, noiDung));
  return d;
}
function oChips(ds, daChon, doi, lopNS){
  var w = el("div","chips");
  ds.forEach(function(m){
    var nhan = (typeof m === "string") ? m : m.t;
    var ns   = (typeof m === "string") ? null : m.ns;
    var b = el("button", "chip" + (ns && lopNS ? " ns" : ""));
    var d = el("span","dau", daChon.indexOf(nhan) >= 0 ? "✓" : "+");
    b.appendChild(d);
    b.appendChild(document.createTextNode(nhan));
    b.type = "button";
    b.setAttribute("aria-pressed", daChon.indexOf(nhan) >= 0 ? "true" : "false");
    b.onclick = function(){
      var k = daChon.indexOf(nhan);
      if(k >= 0) daChon.splice(k,1); else daChon.push(nhan);
      b.setAttribute("aria-pressed", k >= 0 ? "false" : "true");
      d.textContent = k >= 0 ? "+" : "✓";
      luu();
      if(doi) doi();
    };
    w.appendChild(b);
  });
  return w;
}
function oRadio(ds, giaTri, dat){
  var w = el("div","radio");
  ds.forEach(function(m){
    var b = el("button", null, m);
    b.type = "button";
    b.setAttribute("aria-pressed", giaTri() === m ? "true" : "false");
    b.onclick = function(){
      dat(m); luu();
      Array.prototype.forEach.call(w.children, function(x){
        x.setAttribute("aria-pressed", x.textContent === m ? "true" : "false");
      });
    };
    w.appendChild(b);
  });
  return w;
}
function oChu(giaTri, dat, chuGoi, nhieuDong){
  var e = el(nhieuDong ? "textarea" : "input","o");
  if(!nhieuDong) e.type = "text";
  e.value = giaTri() || "";
  if(chuGoi) e.placeholder = chuGoi;
  var hen = null;
  e.oninput = function(){
    dat(e.value);
    clearTimeout(hen);
    hen = setTimeout(function(){ luu(); kiemTraThat(e); }, 500);
  };
  return e;
}
function nutKhongRo(dat, lam){
  var b = el("button","khongro","Tôi không rõ mục này");
  b.type = "button";
  b.onclick = function(){ dat("Không rõ"); luu(); if(lam) lam(); };
  return b;
}

/* Nhắc khi người điền lỡ gõ dữ liệu thật */
function kiemTraThat(o){
  var v = o.value || "";
  var co = /\b\d{9,12}\b/.test(v) || /\b0\d{9}\b/.test(v);
  var cu = o.parentNode && o.parentNode.querySelector(".bao.do.nhac");
  if(co && !cu){
    var b = el("div","bao do nhac");
    b.innerHTML = "<b>Khoan đã.</b> Hình như anh/chị/em vừa gõ một dãy số giống số điện thoại hoặc số căn cước. " +
      "Phiếu này chỉ ghi <b>loại</b> thông tin, ví dụ &ldquo;số điện thoại người bệnh&rdquo;, " +
      "tuyệt đối không ghi dữ liệu thật của bất kỳ ai.";
    o.parentNode.appendChild(b);
  } else if(!co && cu){
    cu.remove();
  }
}

  for(var i=0;i<VIEC.length;i++) if(VIEC[i].id===id) viec = VIEC[i];

  dau.style.letterSpacing = ".04em";
  dau.style.textTransform = "uppercase";

  var h = el("h1", null, tenViec);
  h.style.marginBottom = "1.25rem";
  m.appendChild(h);

  /* --- A --- */
  var A = nhomMoi("Việc này làm để làm gì", "Em điền sẵn rồi, anh/chị/em sửa lại cho đúng với khoa mình nếu cần.");
  var a1 = cauMoi("Tên việc");
  a1.appendChild(oChu(function(){return p.ten || tenViec}, function(v){p.ten=v}));
  A.appendChild(a1);
  var a2 = cauMoi("Mục đích");
  a2.appendChild(oChu(function(){return p.mucDich}, function(v){p.mucDich=v}, "Làm việc này để làm gì?", true));
  A.appendChild(a2);
  m.appendChild(A);

/* Gửi phiếu thẳng tới Google Apps Script */
function nop(nut, vung, oMa){
  var ma = ((oMa && oMa.value) || "").trim();
  if(!ma){ loiNop(vung, "Anh/chị/em chưa gõ mã khoa.", false); return; }
  try{ localStorage.setItem(KHOA_MA, ma); }catch(e){}

  nut.disabled = true;
  nut.textContent = "Đang nộp...";
  var than = new URLSearchParams();
  than.set("ma", ma);
  than.set("payload", JSON.stringify(goiDuLieu()));

  fetch(DIA_CHI_NOP, {method:"POST", body: than})
    .then(function(r){ return r.json(); })
    .then(function(k){
      nut.disabled = false;
      if(k && k.ok){ daNop = true; veNop(vung); window.scrollTo({top:0}); return; }
      nut.textContent = "Nộp phiếu";
      if(k && k.loi === "ma_sai"){
        loiNop(vung, "Mã khoa không đúng. Hỏi lại người tổng hợp của khoa rồi gõ lại.", false);
      } else {
        loiNop(vung, "Nơi nhận phiếu báo lỗi, chưa lưu được.", true);
      }
    })["catch"](function(){
      nut.disabled = false;
      nut.textContent = "Nộp phiếu";
      loiNop(vung, "Không gửi được — có thể do mạng cơ quan chặn hoặc đường dẫn nộp chưa đúng.", true);
    });
}

function loiNop(vung, vi, moChepLuon){
  var cu = vung.querySelector(".bao.loiNop");
  if(cu) cu.remove();
  var b = el("div","bao do loiNop");
  b.innerHTML = "<b>Chưa nộp được.</b> " + vi +
    (moChepLuon ? " Anh/chị/em bấm <b>Hoặc chép để gửi email</b>, dán vào email gửi người tổng hợp của khoa là xong — không mất công điền lại." : "");
  vung.appendChild(b);
  if(moChepLuon) moChep(vung);
}

/* Chép một chuỗi vào bộ nhớ tạm, có báo lại trên chính cái nút vừa bấm */
function chepChuoi(chuoi, nut, chuGoc){
  var xong = function(){
    nut.textContent = "Đã chép";
    setTimeout(function(){ nut.textContent = chuGoc; }, 2500);
  };
  try{
    navigator.clipboard.writeText(chuoi).then(xong)["catch"](function(){ nut.textContent = "Chép không được"; });
  }catch(e){ nut.textContent = "Chép không được"; }
}

function moChep(vung){
  var cu = vung.querySelector(".vungChep");
  if(cu){ cu.scrollIntoView({block:"nearest"}); return; }
  var w = el("div","vungChep");
  w.style.marginTop = "1rem";
  var nd = vanBanPhieu(goiDuLieu());

  ta.readOnly = true;
  ta.value = nd;
  w.appendChild(ta);
  var h = el("div","dieuhuong");
  var b = el("button","nut","Chép toàn bộ");
  b.type = "button";
  b.onclick = function(){
    var xong = function(){ b.textContent = "Đã chép"; setTimeout(function(){ b.textContent = "Chép toàn bộ"; }, 2500); };
    try{
      navigator.clipboard.writeText(nd).then(xong)["catch"](function(){ ta.select(); b.textContent = "Nhấn Ctrl+C"; });
    }catch(e){ ta.select(); b.textContent = "Nhấn Ctrl+C"; }
  };
  h.appendChild(b);
  var t = el("a","nut phu","Tải về máy");
  t.href = URL.createObjectURL(new Blob([nd], {type:"text/plain;charset=utf-8"}));
  t.download = "phieu-" + (S.nguoi.hoTen || "khoaduoc").replace(/\s+/g,"-") + ".txt";
  t.style.textDecoration = "none";
  t.style.display = "inline-block";
  h.appendChild(t);
  w.appendChild(h);
  var g = el("p", null, "Dán nguyên khối này vào email nội bộ. Người tổng hợp dán lại vào trang gộp là ra phiếu hoàn chỉnh.");
  g.style.color = "var(--chu-mo)"; g.style.fontSize = ".85rem"; g.style.marginTop = ".5rem";
  w.appendChild(g);
  vung.appendChild(w);
}

function vanBanPhieu(d){
  var r = [];
  r.push("===== PHIEU KHAI BAO DU LIEU CA NHAN - KHOA DUOC =====");
  r.push("Ma phieu: " + d.maPhieu);
  r.push("Nguoi dien: " + d.nguoi.hoTen + " | " + d.nguoi.chucDanh + " | " + d.nguoi.boPhan);
  r.push("");
  d.viec.forEach(function(v, i){
    r.push("--- VIEC " + (i+1) + " ---");
    r.push("1. Ten hoat dong: " + v.ten);
    r.push("2. Muc dich: " + v.mucDich);
    r.push("3. Du lieu cua ai: " + v.chuDL.join(", ") + " | " + v.soNam + " nguoi/nam | dang luu " + v.soLuu);
    r.push("4. Tre em: " + v.treEm);
    r.push("5. Du lieu thu thap: " + v.truong.join(", "));
    r.push("6. Nhay cam: " + (v.nhayCam.length ? v.nhayCam.map(function(x){return "diem " + x;}).join(", ") : "Khong"));
    r.push("7. Nguon: " + v.nguon.join(", "));
    r.push("8. Dong y: " + v.dongY + (v.bieuMau ? " | " + v.bieuMau : ""));
    r.push("9. Noi luu: " + v.noiLuu.join(", "));
    r.push("10. Ai xem sua: " + v.aiXem.join(", ") + (v.soNguoi ? " (" + v.soNguoi + " nguoi)" : ""));
    r.push("11. Chia se: trong BV: " + v.trongBV.join(", ") + " | ngoai BV: " + v.ngoaiBV + " | nuoc ngoai: " + v.nuocNgoai);
    r.push("12. Luu bao lau: " + v.luuLau + (v.luuGhi ? " | " + v.luuGhi : ""));
    r.push("13. Bao ve: " + v.baoVe.join(", "));
    r.push("14. Ghi chu: " + v.ghiChu);
    r.push("");
  });
  r.push("===== HET =====");
  r.push("@@JSON@@" + JSON.stringify(d));
  return r.join("\n");
}

/* ===================== TRANG GỘP ===================== */

function manTongHop(m){
  var h = el("h1", null, "Gộp phiếu của cả khoa");
  h.style.marginBottom = ".5rem";
  m.appendChild(h);
  var p = el("p", null, "Dành cho người tổng hợp. Mở từng email nhân viên gửi về, dán khối nội dung vào ô dưới đây, bấm Thêm. Làm hết lượt là có ngay bảng C.2 và các phiếu C.3 để dán sang file Word.");
  p.style.color = "var(--chu-mo)";
  p.style.marginBottom = "1.25rem";
  m.appendChild(p);

  var tuKho = [];
  if(DIA_CHI_NOP){
    var kho = nhomMoi("Phiếu nộp thẳng vào Drive", "Những người bấm nút Nộp phiếu nằm ở đây, không phải dán tay.");
    var ds = el("div");
    kho.appendChild(ds);
    m.appendChild(kho);

    var baoKho = function(loi){
      ds.innerHTML = "";
      var b = el("div","bao");
      b.innerHTML = "<b>" + loi + "</b> Phần dán tay bên dưới vẫn dùng bình thường.";
      ds.appendChild(b);
    };

    var tai = function(ma){
      ds.innerHTML = "";
      ds.appendChild(el("p","vidu","Đang đọc bảng tổng hợp..."));
      fetch(DIA_CHI_NOP + "?key=" + encodeURIComponent(ma))
        .then(function(r){ return r.json(); })
        .then(function(k){
          if(!k || !k.ok){ baoKho("Mã quản trị không đúng."); return; }
          try{ localStorage.setItem("dpia-khoaduoc-quantri", ma); }catch(e){}
          tuKho = k.phieu || [];
          ds.innerHTML = "";
          if(!tuKho.length){
            ds.appendChild(el("p","vidu","Chưa ai bấm nộp thẳng."));
          } else {
            var ul = el("div","chips");
            tuKho.forEach(function(d){
              var cc = el("span","chip");
              cc.setAttribute("aria-pressed","true");
              cc.textContent = ((d.nguoi && d.nguoi.hoTen) || "(không rõ)") + " · " + ((d.viec && d.viec.length) || 0) + " việc";
              ul.appendChild(cc);
            });
            ds.appendChild(ul);
          }
          var lam = el("button","nut phu","Đọc lại");
          lam.type = "button";
          lam.style.marginTop = ".75rem";
          lam.onclick = function(){ tai(ma); };
          ds.appendChild(lam);
          veKetQua();
        })["catch"](function(){ baoKho("Không đọc được bảng tổng hợp."); });
    };

    var cq = cauMoi("Mã quản trị", "Mã đặt trong Code.gs. Chỉ người tổng hợp giữ mã này.");
    var oq = el("input","o");
    oq.type = "password";
    oq.style.maxWidth = "16rem";
    try{ oq.value = localStorage.getItem("dpia-khoaduoc-quantri") || ""; }catch(e){}
    cq.appendChild(oq);
    var hq = el("div","dieuhuong");
    var bq = el("button","nut","Đọc phiếu đã nộp");
    bq.type = "button";
    bq.onclick = function(){ if(oq.value.trim()) tai(oq.value.trim()); };
    hq.appendChild(bq);
    cq.appendChild(hq);
    ds.appendChild(cq);
    if(oq.value.trim()) tai(oq.value.trim());
  }

  var thu = [];
  var dan = nhomMoi("Dán phiếu nhận qua email", "Dán từng khối, mỗi lần một phiếu, rồi bấm Thêm. Nếu nhân viên gửi file đính kèm thì mở file đó ra, chép hết nội dung rồi dán vào đây.");
  var ta = el("textarea","chep");
  ta.placeholder = "Dán nguyên khối ===== PHIEU KHAI BAO ... vào đây";
  dan.appendChild(ta);
  var dh = el("div","dieuhuong");
  var nt = el("button","nut","Thêm phiếu này");
  nt.type = "button";
  var bao = el("div");
  nt.onclick = function(){
    var v = ta.value;
    var k = v.indexOf("@@JSON@@");
    bao.innerHTML = "";
    if(k < 0){
      var e = el("div","bao do");
      e.innerHTML = "<b>Không đọc được.</b> Khối dán vào phải còn nguyên dòng cuối bắt đầu bằng @@JSON@@.";
      bao.appendChild(e);
      return;
    }
    try{
      var o = JSON.parse(v.slice(k + 8));
      thu.push(o);
      ta.value = "";
      var ok = el("div","bao xanh");
      ok.innerHTML = "<b>Đã thêm</b> phiếu của " + (o.nguoi && o.nguoi.hoTen ? o.nguoi.hoTen : "(không rõ tên)") +
        " — " + (o.viec ? o.viec.length : 0) + " việc.";
      bao.appendChild(ok);
      veKetQua();
    }catch(err){
      var e2 = el("div","bao do");
      e2.innerHTML = "<b>Khối dán bị cắt mất một phần.</b> Nhờ người gửi chép lại cho đủ.";
      bao.appendChild(e2);
    }
  };
  dh.appendChild(nt);
  dan.appendChild(dh);
  dan.appendChild(bao);
  m.appendChild(dan);

  var kq = nhomMoi("Bảng C.2 và các phiếu C.3 để dán vào Word");
  var vungKQ = el("div");
  kq.appendChild(vungKQ);
  m.appendChild(kq);

  function veKetQua(){
    var tatCa = tuKho.concat(thu);
    vungKQ.innerHTML = "";
    if(!tatCa.length){
      vungKQ.appendChild(el("p","vidu","Chưa có phiếu nào. Khi có phiếu, bảng tổng hợp hiện ở đây."));
      return;
    }
    var hd = [];
    tatCa.forEach(function(d){
      (d.viec||[]).forEach(function(v){
        hd.push({v:v, nguoi:(d.nguoi&&d.nguoi.hoTen)||""});
      });
    });
    var tt = el("p", null, tatCa.length + " người đã điền · " + hd.length + " việc được khai");
    tt.style.fontWeight = "600";
    tt.style.marginBottom = ".75rem";
    vungKQ.appendChild(tt);

    var cuon = el("div","cuon");
    var bg = el("table","bang");
    var tr = el("tr");
    ["STT","Tên hoạt động","Dữ liệu của ai","Nhạy cảm","Người khai"].forEach(function(x){ tr.appendChild(el("th",null,x)); });
    bg.appendChild(tr);
    hd.forEach(function(x, i){
      var r = el("tr");
      r.appendChild(el("td",null,String(i+1)));
      r.appendChild(el("td",null,x.v.ten||""));
      r.appendChild(el("td",null,(x.v.chuDL||[]).join(", ")));
      r.appendChild(el("td",null,(x.v.nhayCam&&x.v.nhayCam.length) ? ("Có – " + x.v.nhayCam.map(function(y){return "điểm "+y;}).join(", ")) : "Không"));
      r.appendChild(el("td",null,x.nguoi));
      bg.appendChild(r);
    });
    cuon.appendChild(bg);
    vungKQ.appendChild(cuon);

    var vb = el("textarea","chep");
    vb.readOnly = true;
    vb.style.marginTop = "1rem";
    vb.value = vanBanTongHop(hd);
    vungKQ.appendChild(vb);

    var h2 = el("div","dieuhuong");
    var bc = el("button","nut","Chép toàn bộ để dán vào Word");
    bc.type = "button";
    bc.onclick = function(){
      try{
        navigator.clipboard.writeText(vb.value).then(function(){
          bc.textContent = "Đã chép"; setTimeout(function(){ bc.textContent = "Chép toàn bộ để dán vào Word"; }, 2500);
        })["catch"](function(){ vb.select(); bc.textContent = "Nhấn Ctrl+C"; });
      }catch(e){ vb.select(); bc.textContent = "Nhấn Ctrl+C"; }
    };
    h2.appendChild(bc);
    var bj = el("button","nut phu","Chép dữ liệu thô (JSON)");
    bj.type = "button";
    bj.onclick = function(){
      var j = JSON.stringify(tatCa, null, 1);
      try{ navigator.clipboard.writeText(j).then(function(){ bj.textContent = "Đã chép"; setTimeout(function(){ bj.textContent="Chép dữ liệu thô (JSON)"; },2500); })["catch"](function(){}); }catch(e){}
    };
    h2.appendChild(bj);
    vungKQ.appendChild(h2);
  }
  veKetQua();

  var veLai = el("div","dieuhuong");
  var vl = el("button","nut phu","Về trang điền phiếu");
  vl.type = "button";
  vl.onclick = function(){ location.hash = ""; };
  veLai.appendChild(vl);
  m.appendChild(veLai);

}

function vanBanTongHop(hd){
  var r = [];
  r.push("C.2. DANH SACH HOAT DONG CUA DON VI");
  r.push("");
  hd.forEach(function(x, i){
    r.push((i+1) + "\t" + x.v.ten + "\t" + (x.v.chuDL||[]).join(", ") + "\t" +
      ((x.v.nhayCam&&x.v.nhayCam.length) ? "Co" : "Khong") + "\tPhieu so " + (i+1));
  });
  r.push("");
  r.push("C.3. PHIEU CHI TIET TUNG HOAT DONG");
  hd.forEach(function(x, i){
    var v = x.v;
    r.push("");
    r.push("Phieu so: " + (i+1) + " - " + v.ten);
    r.push("1. Ten hoat dong\t" + v.ten);
    r.push("2. Muc dich\t" + v.mucDich);
    r.push("3. Du lieu cua ai va so luong\t" + (v.chuDL||[]).join(", ") + "; khoang " + v.soNam + " nguoi/nam; dang luu " + v.soLuu);
    r.push("4. Co tre em\t" + v.treEm);
    r.push("5. Du lieu co ban thu thap\t" + (v.truong||[]).filter(function(t){ return !laNhayCam(t); }).join(", "));
    r.push("6. Du lieu nhay cam thu thap\t" + ((v.truong||[]).filter(laNhayCam).join(", ") || "Khong") +
      ((v.nhayCam&&v.nhayCam.length) ? " (" + v.nhayCam.map(function(y){return "Diem "+y;}).join(", ") + ")" : ""));
    r.push("7. Nguon va cach thu thap\t" + (v.nguon||[]).join(", "));
    r.push("8. Thong bao va su dong y\t" + v.dongY + (v.bieuMau ? "; " + v.bieuMau : ""));
    r.push("9. Noi luu\t" + (v.noiLuu||[]).join(", "));
    r.push("10. Ai duoc xem, sua\t" + (v.aiXem||[]).join(", ") + (v.soNguoi ? " (" + v.soNguoi + " nguoi)" : ""));
    r.push("11. Chia se cho ai\tTrong BV: " + (v.trongBV||[]).join(", ") + ". Ngoai BV: " + v.ngoaiBV + ". Ra nuoc ngoai: " + v.nuocNgoai);
    r.push("12. Luu bao lau, xoa huy\t" + v.luuLau + (v.luuGhi ? "; " + v.luuGhi : ""));
    r.push("13. Bien phap bao ve\t" + (v.baoVe||[]).join(", "));
    r.push("14. Ghi chu\t" + (v.ghiChu || "Khong") + " [Nguoi khai: " + x.nguoi + "]");
  });
  return r.join("\n");
}
function laNhayCam(t){
  for(var i=0;i<TRUONG.length;i++) if(TRUONG[i].t === t) return !!TRUONG[i].ns;
  return false;
}

/* ===================== KHUNG ĐIỀU HƯỚNG ===================== */

function dieuHuong(lui, toi, kiemTra, loi, nhanToi){
  var w = el("div","dieuhuong chinh");
  if(lui >= 0){
    var b1 = el("button","nut phu","Quay lại");
    b1.type = "button";
    b1.onclick = function(){ di(lui); };
    w.appendChild(b1);
  }
  var b2 = el("button","nut", nhanToi || "Tiếp tục");
  b2.type = "button";
  b2.onclick = function(){
    if(kiemTra && !kiemTra()){
      var cu = w.parentNode.querySelector(".bao.canhLoi");
      if(cu) cu.remove();
      var e = el("div","bao canhLoi");
      e.textContent = loi || "Còn thiếu thông tin.";
      w.parentNode.insertBefore(e, w);
      return;
    }
    di(toi);
  };
  w.appendChild(b2);
  return w;
}

function capNhatThanh(){
  var b = cacBuoc();
  var t = document.getElementById("thanh");
  if(t) t.style.width = Math.round(S.buoc / Math.max(1, b.length-1) * 100) + "%";
  veTrangThai();
}

function ve(){
  var m = document.getElementById("man");
  m.innerHTML = "";
  if(location.hash === "#tong-hop"){
    var t = document.getElementById("thanh");
    if(t) t.style.width = "100%";
    document.getElementById("trangthai").textContent = "Trang gộp";
    manTongHop(m);
    chan(m);
    return;
  }
  var b = cacBuoc();
  var cur = b[Math.min(S.buoc, b.length-1)];
  if(cur.k === "mo") manMo(m);
  else if(cur.k === "nguoi") manNguoi(m);
  else if(cur.k === "chon") manChon(m);
  else if(cur.k === "phieu") manPhieu(m, cur.id, S.chon.indexOf(cur.id) + 1);
  else manXong(m);
  capNhatThanh();
  chan(m);
}
function chan(m){
  var c = el("div","chan");
  c.innerHTML = "Phiếu nội bộ của Bệnh viện Truyền máu Huyết học. Chỉ mô tả loại thông tin, không ghi dữ liệu cá nhân thật. " +
    "Căn cứ: Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15, Nghị định số 356/2025/NĐ-CP, Tờ trình số 71/TTr-CNTT ngày 11/11/2026.";
  var x = el("div");
  x.style.marginTop = ".6rem";
  var b = el("button","lienket","Xóa bản nháp, bắt đầu phiếu mới");
  b.type = "button";
  b.onclick = function(){
    try{ localStorage.removeItem(KHOA_LUU); }catch(e){}
    S = {nguoi:{hoTen:"",chucDanh:"",boPhan:""}, chon:[], khac:[], phieu:{}, buoc:0, maPhieu:taoMa()};
    /* Máy dùng chung: người sau phải thấy "Nộp phiếu", không phải "Nộp lại bản mới" */
    daNop = false;
    ve();
    window.scrollTo({top:0});
  };
  x.appendChild(b);
  c.appendChild(x);
  m.appendChild(c);
}

/* ===================== KHỞI ĐỘNG ===================== */

doc();
ve();
window.addEventListener("hashchange", ve);
