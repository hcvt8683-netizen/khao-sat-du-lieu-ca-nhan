<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khảo sát dữ liệu cá nhân — Khoa Dược</title>
<meta name="description" content="Phiếu khai báo hoạt động xử lý dữ liệu cá nhân tại Khoa Dược, Bệnh viện Truyền máu Huyết học.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none !important}
/* Layout: một cột hẹp, thanh tiến độ dính trên cùng, mỗi bước là một nhóm câu hỏi phẳng có viền */
:root{
  --muc: #0f4c52;        /* xanh petrol - màu chủ đạo */
  --muc-nhat: #e3f0f0;
  --muc-dam: #0a3539;
  --giay: #f7f5f1;       /* nền giấy ấm */
  --mat: #ffffff;
  --chu: #1c2321;
  --chu-mo: #5d6866;
  --vien: #d8d4cc;
  --nhan: #b4690e;       /* hổ phách - cần chú ý */
  --nhan-nen: #fdf3e2;
  --canh: #a32c1e;       /* đỏ trầm - dữ liệu nhạy cảm */
  --canh-nen: #fbeae7;
  --ok: #2b6b4f;
  --ok-nen: #e6f2eb;
  color-scheme: light;
  --f-tieu: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-chu: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --muc:#5fc3c9; --muc-nhat:#13302f; --muc-dam:#8ad8dc;
    --giay:#13181a; --mat:#1b2225; --chu:#e8eceb; --chu-mo:#9aa8a6; --vien:#32403f;
    --nhan:#e0a44a; --nhan-nen:#302616; --canh:#ef8b7c; --canh-nen:#331d1a;
    --ok:#6fc49a; --ok-nen:#172b22; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --muc:#5fc3c9; --muc-nhat:#13302f; --muc-dam:#8ad8dc;
  --giay:#13181a; --mat:#1b2225; --chu:#e8eceb; --chu-mo:#9aa8a6; --vien:#32403f;
  --nhan:#e0a44a; --nhan-nen:#302616; --canh:#ef8b7c; --canh-nen:#331d1a;
  --ok:#6fc49a; --ok-nen:#172b22; color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--giay);color:var(--chu);font-family:var(--f-chu);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mat)}
h1,h2,h3{font-family:var(--f-tieu);text-wrap:balance;margin:0}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button{font-family:inherit;font-size:1rem;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:1rem}
a{color:var(--muc)}

.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--mat);border-bottom:1px solid var(--vien)}
.rail-in{max-width:760px;margin:0 auto;padding-block:.6rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.rail-ten{font-family:var(--f-tieu);font-weight:600;font-size:.95rem;color:var(--muc);min-width:0}
.rail-trangthai{margin-left:auto;font-size:.8rem;color:var(--chu-mo);font-variant-numeric:tabular-nums}
.thanh{height:4px;background:var(--vien);border-radius:2px;overflow:hidden;flex:1 1 120px;min-width:80px}
.thanh i{display:block;height:100%;background:var(--muc);transition:width .3s ease}

.khung{max-width:760px;margin:0 auto;padding-block:1.5rem 4rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.nhom{background:var(--mat);border:1px solid var(--vien);border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.nhom > header{margin-bottom:1rem;padding-bottom:.75rem;border-bottom:1px solid var(--vien)}
.nhom > header p{color:var(--chu-mo);font-size:.9rem;margin-top:.25rem}

.cau{margin-bottom:1.5rem}
.cau:last-child{margin-bottom:0}
.cau > label, .cau-tieu{display:block;font-family:var(--f-tieu);font-weight:600;font-size:1rem;margin-bottom:.15rem}
.vidu{font-size:.85rem;color:var(--chu-mo);margin-bottom:.5rem}
.vidu b{font-weight:600;color:var(--chu)}

.o{width:100%;padding:.6rem .7rem;border:1px solid var(--vien);border-radius:7px;background:var(--giay);color:var(--chu)}
.o:focus-visible{outline:2px solid var(--muc);outline-offset:1px}
textarea.o{min-height:4.5rem;resize:vertical;line-height:1.5}
.hang{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.hang > .o{flex:1 1 10rem;min-width:0}
.so{width:7rem;text-align:right;font-variant-numeric:tabular-nums}

.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .7rem;border:1px solid var(--vien);
  border-radius:999px;background:var(--mat);color:var(--chu);font-size:.88rem;line-height:1.35;text-align:left}
.chip:hover{border-color:var(--muc)}
.chip[aria-pressed="true"]{background:var(--muc-nhat);border-color:var(--muc);color:var(--muc-dam);font-weight:500}
.chip .dau{font-weight:700;opacity:.55}
.chip[aria-pressed="true"] .dau{opacity:1}
.chip.ns[aria-pressed="true"]{background:var(--canh-nen);border-color:var(--canh);color:var(--canh)}

.radio{display:flex;flex-wrap:wrap;gap:.4rem}
.radio button{padding:.4rem .9rem;border:1px solid var(--vien);border-radius:7px;background:var(--mat);color:var(--chu);font-size:.9rem}
.radio button[aria-pressed="true"]{background:var(--muc);border-color:var(--muc);color:#fff;font-weight:500}

.khongro{background:none;border:none;color:var(--muc);font-size:.82rem;text-decoration:underline;
  text-underline-offset:3px;padding:.2rem 0;margin-top:.35rem}

.bao{border-left:3px solid var(--nhan);background:var(--nhan-nen);color:var(--chu);
  padding:.6rem .8rem;border-radius:0 7px 7px 0;font-size:.88rem;margin-top:.6rem}
.bao.do{border-left-color:var(--canh);background:var(--canh-nen)}
.bao.xanh{border-left-color:var(--ok);background:var(--ok-nen)}
.bao b{font-weight:600}

.the{display:grid;gap:.6rem}
.the button{display:block;width:100%;text-align:left;padding:.85rem 1rem;border:1px solid var(--vien);
  border-radius:9px;background:var(--mat);color:var(--chu)}
.the button:hover{border-color:var(--muc)}
.the button[aria-pressed="true"]{border-color:var(--muc);background:var(--muc-nhat);box-shadow:inset 3px 0 0 var(--muc)}
.the .t{font-family:var(--f-tieu);font-weight:600;display:block}
.the .m{display:block;font-size:.86rem;color:var(--chu-mo);margin-top:.15rem}
.the button[aria-pressed="true"] .m{color:var(--muc-dam)}

.dieu{margin-top:.5rem;font-size:.85rem}
.dieu summary{cursor:pointer;color:var(--muc);list-style:none;display:inline-flex;align-items:center;gap:.3rem}
.dieu summary::-webkit-details-marker{display:none}
.dieu summary::before{content:"?";display:inline-grid;place-items:center;width:1.1rem;height:1.1rem;
  border:1px solid currentColor;border-radius:50%;font-size:.72rem;font-weight:700}
.dieu p{margin-top:.5rem;color:var(--chu-mo);padding-left:1.4rem;border-left:1px solid var(--vien)}

.dieuhuong{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.25rem}
.nut{padding:.7rem 1.4rem;border-radius:8px;border:1px solid var(--muc);background:var(--muc);color:#fff;font-weight:600}
.nut:hover{background:var(--muc-dam);border-color:var(--muc-dam)}
.nut.phu{background:transparent;color:var(--muc)}
.nut.phu:hover{background:var(--muc-nhat)}
.nut:disabled{opacity:.45;cursor:not-allowed}
.nut.lon{font-size:1.05rem;padding:.85rem 1.8rem}

.tomtat{border:1px solid var(--vien);border-radius:9px;overflow:hidden;margin-bottom:.75rem;background:var(--mat)}
.tomtat > h3{padding:.7rem 1rem;background:var(--muc-nhat);color:var(--muc-dam);font-size:.95rem}
.tomtat dl{margin:0;padding:.5rem 1rem 1rem;display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr);gap:.1rem .9rem}
.tomtat dt{font-size:.84rem;color:var(--chu-mo);padding-top:.45rem}
.tomtat dd{margin:0;padding-top:.45rem;font-size:.92rem;min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){ .tomtat dl{grid-template-columns:1fr;gap:0} .tomtat dt{padding-top:.6rem} .tomtat dd{padding-top:.1rem} }

.chep{width:100%;min-height:11rem;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.8rem;
  border:1px solid var(--vien);border-radius:7px;padding:.7rem;background:var(--giay);color:var(--chu);white-space:pre;overflow:auto}

.bang{width:100%;border-collapse:collapse;font-size:.88rem}
.bang th,.bang td{border:1px solid var(--vien);padding:.45rem .6rem;text-align:left;vertical-align:top}
.bang th{background:var(--muc-nhat);color:var(--muc-dam);font-family:var(--f-tieu);font-weight:600}
.cuon{overflow-x:auto}

.chan{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--vien);font-size:.82rem;color:var(--chu-mo)}
.chan a{color:var(--muc)}
.lienket{background:none;border:none;color:var(--chu-mo);font-size:.82rem;text-decoration:underline;text-underline-offset:3px;padding:0}

@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>

<div class="rail">
  <div class="rail-in">

</div>

<main class="khung" id="man"></main>

  chon:[],
  khac:[],
  phieu:{},
  buoc:0,
  maPhieu:""
};
var daNop = false;
var KHOA_MA = "dpia-khoaduoc-ma";

function taoMa(){
  return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function luu(){
  try{ localStorage.setItem(KHOA_LUU, JSON.stringify(S)); baoLuu(); }catch(e){}
}
function doc(){
  try{
    var r = localStorage.getItem(KHOA_LUU);
    if(r){ var o = JSON.parse(r); if(o && o.nguoi){ S = o; } }
  }catch(e){}
  if(!S.maPhieu) S.maPhieu = taoMa();
}
var hienLuu = null;
function baoLuu(){
  var el = document.getElementById("trangthai");
  if(!el) return;
  var g = new Date();
  var hm = String(g.getHours()).padStart(2,"0") + ":" + String(g.getMinutes()).padStart(2,"0");
  el.textContent = "Đã lưu nháp " + hm;
  clearTimeout(hienLuu);
  hienLuu = setTimeout(veTrangThai, 4000);
}
function veTrangThai(){
  var el = document.getElementById("trangthai");
  if(!el) return;
  var b = cacBuoc();
  el.textContent = S.buoc === 0 ? "Chưa bắt đầu" : ("Bước " + (S.buoc+1) + "/" + b.length);
}

/* ===================== PHIẾU ===================== */

function phieuMoi(viec){
  return {
    ten: viec ? viec.ten : "",
    mucDich: viec ? viec.mucDich : "",
    chuDL: [], soNam:"", soLuu:"",
    treEm:"",
    truong: [],
    nguon: [],
    dongY:"", bieuMau:"",
    noiLuu: [],
    aiXem: [], soNguoi:"",
    trongBV: [], ngoaiBV:"", nuocNgoai:"",
    luuLau:"", luuGhi:"",
    baoVe: [],
    ghiChu:""
  };
}
function layPhieu(id){
  if(!S.phieu[id]){
    var v = null;
    for(var i=0;i<VIEC.length;i++){ if(VIEC[i].id===id) v = VIEC[i]; }
    if(!v){ for(var j=0;j<S.khac.length;j++){ if(S.khac[j].id===id) v = S.khac[j]; } }
    S.phieu[id] = phieuMoi(v);
  }
  return S.phieu[id];
}
function diemNhayCam(p){
  var ra = [], co = {};
  for(var i=0;i<p.truong.length;i++){
    for(var j=0;j<TRUONG.length;j++){
      if(TRUONG[j].t === p.truong[i] && TRUONG[j].ns && !co[TRUONG[j].ns]){
        co[TRUONG[j].ns] = 1; ra.push(TRUONG[j].ns);
      }
    }
  }
  ra.sort();
  return ra;
}

/* ===================== ĐIỀU HƯỚNG ===================== */

function cacBuoc(){
  var b = [{k:"mo"},{k:"nguoi"},{k:"chon"}];
  for(var i=0;i<S.chon.length;i++) b.push({k:"phieu", id:S.chon[i]});
  b.push({k:"xong"});
  return b;
}
function di(n){
  var b = cacBuoc();
  S.buoc = Math.max(0, Math.min(n, b.length-1));
  luu(); ve();
  window.scrollTo({top:0, behavior:"instant"});
}

/* ===================== DỰNG GIAO DIỆN ===================== */

function el(tag, cls, txt){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt != null) e.textContent = txt;
  return e;
}
function nhomMoi(tieu, phu){
  var n = el("section","nhom");
  if(tieu){
    var h = el("header");
    h.appendChild(el("h2", null, tieu));
    if(phu) h.appendChild(el("p", null, phu));
    n.appendChild(h);
  }
  return n;
}
function cauMoi(tieu, vidu){
  var c = el("div","cau");
  c.appendChild(el("div","cau-tieu",tieu));
  if(vidu){
    var v = el("div","vidu");
    v.innerHTML = vidu;
    c.appendChild(v);
  }
  return c;
}
function giaiThich(noiDung){
  var d = el("details","dieu");
  d.appendChild(el("summary", null, "Vì sao hỏi câu này"));
  d.appendChild(el("p", null, noiDung));
  return d;
}
function oChips(ds, daChon, doi, lopNS){
  var w = el("div","chips");
  ds.forEach(function(m){
    var nhan = (typeof m === "string") ? m : m.t;
    var ns   = (typeof m === "string") ? null : m.ns;
    var b = el("button", "chip" + (ns && lopNS ? " ns" : ""));
    var d = el("span","dau", daChon.indexOf(nhan) >= 0 ? "✓" : "+");
    b.appendChild(d);
    b.appendChild(document.createTextNode(nhan));
    b.type = "button";
    b.setAttribute("aria-pressed", daChon.indexOf(nhan) >= 0 ? "true" : "false");
    b.onclick = function(){
      var k = daChon.indexOf(nhan);
      if(k >= 0) daChon.splice(k,1); else daChon.push(nhan);
      b.setAttribute("aria-pressed", k >= 0 ? "false" : "true");
      d.textContent = k >= 0 ? "+" : "✓";
      luu();
      if(doi) doi();
    };
    w.appendChild(b);
  });
  return w;
}
function oRadio(ds, giaTri, dat){
  var w = el("div","radio");
  ds.forEach(function(m){
    var b = el("button", null, m);
    b.type = "button";
    b.setAttribute("aria-pressed", giaTri() === m ? "true" : "false");
    b.onclick = function(){
      dat(m); luu();
      Array.prototype.forEach.call(w.children, function(x){
        x.setAttribute("aria-pressed", x.textContent === m ? "true" : "false");
      });
    };
    w.appendChild(b);
  });
  return w;
}
function oChu(giaTri, dat, chuGoi, nhieuDong){
  var e = el(nhieuDong ? "textarea" : "input","o");
  if(!nhieuDong) e.type = "text";
  e.value = giaTri() || "";
  if(chuGoi) e.placeholder = chuGoi;
  var hen = null;
  e.oninput = function(){
    dat(e.value);
    clearTimeout(hen);
    hen = setTimeout(function(){ luu(); kiemTraThat(e); }, 500);
  };
  return e;
}
function nutKhongRo(dat, lam){
  var b = el("button","khongro","Tôi không rõ mục này");
  b.type = "button";
  b.onclick = function(){ dat("Không rõ"); luu(); if(lam) lam(); };
  return b;
}

/* Nhắc khi người điền lỡ gõ dữ liệu thật */
function kiemTraThat(o){
  var v = o.value || "";
  var co = /\b\d{9,12}\b/.test(v) || /\b0\d{9}\b/.test(v);
  var cu = o.parentNode && o.parentNode.querySelector(".bao.do.nhac");
  if(co && !cu){
    var b = el("div","bao do nhac");
    b.innerHTML = "<b>Khoan đã.</b> Có vẻ bạn vừa gõ một dãy số giống số điện thoại hoặc số căn cước. " +
      "Phiếu này chỉ ghi <b>loại</b> thông tin, ví dụ &ldquo;số điện thoại người bệnh&rdquo;, " +
      "tuyệt đối không ghi dữ liệu thật của bất kỳ ai.";
    o.parentNode.appendChild(b);
  } else if(!co && cu){
    cu.remove();
  }
}

function goiDuLieu(){
  return {
    maPhieu: S.maPhieu,
    nguoi: S.nguoi,
    napLuc: new Date().toISOString(),
    viec: S.chon.map(function(id){
      var ph = layPhieu(id);
      var o = JSON.parse(JSON.stringify(ph));
      o.id = id;
      o.nhayCam = diemNhayCam(ph);
      o.truongCoBan = ph.truong.filter(function(t){ return !laNhayCam(t); });
      o.truongNhayCam = ph.truong.filter(laNhayCam);
      return o;
    })
  };
}

function nop(nut, vung, oMa){
  var ma = ((oMa && oMa.value) || "").trim();
  if(!ma){ loiNop(vung, "Bạn chưa gõ mã khoa.", false); return; }
  try{ localStorage.setItem(KHOA_MA, ma); }catch(e){}

  nut.disabled = true;
  nut.textContent = "Đang nộp...";
  var than = new URLSearchParams();
  than.set("ma", ma);
  than.set("payload", JSON.stringify(goiDuLieu()));

  fetch(DIA_CHI_NOP, {method:"POST", body: than})
    .then(function(r){ return r.json(); })
    .then(function(k){
      nut.disabled = false;
      if(k && k.ok){ daNop = true; veNop(vung); window.scrollTo({top:0}); return; }
      nut.textContent = "Nộp phiếu";
      if(k && k.loi === "ma_sai"){
        loiNop(vung, "Mã khoa không đúng. Hỏi lại người tổng hợp của khoa rồi gõ lại.", false);
      } else {
        loiNop(vung, "Nơi nhận phiếu báo lỗi, chưa lưu được.", true);
      }
    })["catch"](function(){
      nut.disabled = false;
      nut.textContent = "Nộp phiếu";
      loiNop(vung, "Không gửi được — có thể do mạng cơ quan chặn hoặc đường dẫn nộp chưa đúng.", true);
    });
}

function loiNop(vung, vi, moChepLuon){

  vung.appendChild(b);
  if(moChepLuon) moChep(vung);

function moChep(vung){
  var cu = vung.querySelector(".vungChep");
  if(cu){ cu.scrollIntoView({block:"nearest"}); return; }
  var w = el("div","vungChep");
  w.style.marginTop = "1rem";
  var nd = vanBanPhieu(goiDuLieu());
  var ta = el("textarea","chep");
  ta.readOnly = true;
  ta.value = nd;
  w.appendChild(ta);
  var h = el("div","dieuhuong");
  var b = el("button","nut","Chép toàn bộ");
  b.type = "button";
  b.onclick = function(){
    var xong = function(){ b.textContent = "Đã chép"; setTimeout(function(){ b.textContent = "Chép toàn bộ"; }, 2500); };
    try{
      navigator.clipboard.writeText(nd).then(xong)["catch"](function(){ ta.select(); b.textContent = "Nhấn Ctrl+C"; });
    }catch(e){ ta.select(); b.textContent = "Nhấn Ctrl+C"; }
  };
  h.appendChild(b);
  var t = el("a","nut phu","Tải về máy");
  t.href = URL.createObjectURL(new Blob([nd], {type:"text/plain;charset=utf-8"}));
  t.download = "phieu-" + (S.nguoi.hoTen || "khoaduoc").replace(/\s+/g,"-") + ".txt";
  t.style.textDecoration = "none";
  h.appendChild(t);
  w.appendChild(h);
  var g = el("p", null, "Dán nguyên khối này vào email nội bộ. Người tổng hợp dán lại vào trang gộp là ra phiếu hoàn chỉnh.");
  g.style.color = "var(--chu-mo)"; g.style.fontSize = ".85rem"; g.style.marginTop = ".5rem";
  w.appendChild(g);
  vung.appendChild(w);
}

function vanBanPhieu(d){
  var r = [];
  r.push("===== PHIEU KHAI BAO DU LIEU CA NHAN - KHOA DUOC =====");
  r.push("Ma phieu: " + d.maPhieu);
  r.push("Nguoi dien: " + d.nguoi.hoTen + " | " + d.nguoi.chucDanh + " | " + d.nguoi.boPhan);
  r.push("");
  d.viec.forEach(function(v, i){
    r.push("--- VIEC " + (i+1) + " ---");
    r.push("1. Ten hoat dong: " + v.ten);
    r.push("2. Muc dich: " + v.mucDich);
    r.push("3. Du lieu cua ai: " + v.chuDL.join(", ") + " | " + v.soNam + " nguoi/nam | dang luu " + v.soLuu);
    r.push("4. Tre em: " + v.treEm);
    r.push("5. Du lieu thu thap: " + v.truong.join(", "));
    r.push("6. Nhay cam: " + (v.nhayCam.length ? v.nhayCam.map(function(x){return "diem " + x;}).join(", ") : "Khong"));
    r.push("7. Nguon: " + v.nguon.join(", "));
    r.push("8. Dong y: " + v.dongY + (v.bieuMau ? " | " + v.bieuMau : ""));
    r.push("9. Noi luu: " + v.noiLuu.join(", "));
    r.push("10. Ai xem sua: " + v.aiXem.join(", ") + (v.soNguoi ? " (" + v.soNguoi + " nguoi)" : ""));
    r.push("11. Chia se: trong BV: " + v.trongBV.join(", ") + " | ngoai BV: " + v.ngoaiBV + " | nuoc ngoai: " + v.nuocNgoai);
    r.push("12. Luu bao lau: " + v.luuLau + (v.luuGhi ? " | " + v.luuGhi : ""));
    r.push("13. Bao ve: " + v.baoVe.join(", "));
    r.push("14. Ghi chu: " + v.ghiChu);
    r.push("");
  });
  r.push("===== HET =====");
  r.push("@@JSON@@" + JSON.stringify(d));
  return r.join("\n");
}

    vungKQ.appendChild(h2);
  }
  veKetQua();

  var veLai = el("div","dieuhuong");
  var vl = el("button","nut phu","Về trang điền phiếu");
  vl.type = "button";
  vl.onclick = function(){ location.hash = ""; };
  veLai.appendChild(vl);
  m.appendChild(veLai);

  function nhacDanTay(loi){
    ds.innerHTML = "";
    var b = el("div","bao");
    b.innerHTML = "<b>" + loi + "</b> Phần dán tay bên dưới vẫn dùng bình thường.";
    ds.appendChild(b);
  }

  function tai(ma){
    ds.innerHTML = "";
    ds.appendChild(el("p","vidu","Đang đọc bảng tổng hợp..."));
    fetch(DIA_CHI_NOP + "?key=" + encodeURIComponent(ma))
      .then(function(r){ return r.json(); })
      .then(function(k){
        if(!k || !k.ok){ nhacDanTay("Mã quản trị không đúng."); return; }
        try{ localStorage.setItem("dpia-khoaduoc-quantri", ma); }catch(e){}
        tuKho = k.phieu || [];
        ds.innerHTML = "";
        if(!tuKho.length){
          ds.appendChild(el("p","vidu","Chưa ai nộp vào bảng tổng hợp."));
        } else {
          var ul = el("div","chips");
          tuKho.forEach(function(d){
            var c = el("span","chip");
            c.setAttribute("aria-pressed","true");
            c.textContent = ((d.nguoi && d.nguoi.hoTen) || "(không rõ)") + " · " + ((d.viec && d.viec.length) || 0) + " việc";
            ul.appendChild(c);
          });
          ds.appendChild(ul);
        }
        var lam = el("button","nut phu","Đọc lại");
        lam.type = "button";
        lam.style.marginTop = ".75rem";
        lam.onclick = function(){ tai(ma); };
        ds.appendChild(lam);
        veKetQua();
      })["catch"](function(){
        nhacDanTay("Không đọc được bảng tổng hợp.");
      });
  }

  if(!DIA_CHI_NOP){
    nhacDanTay("Trang chưa nối với nơi nhận phiếu.");
  } else {
    ds.innerHTML = "";
    var cq = cauMoi("Mã quản trị", "Mã bạn đặt trong Apps Script. Chỉ người tổng hợp giữ mã này.");
    var oq = el("input","o");
    oq.type = "password";
    oq.style.maxWidth = "16rem";
    try{ oq.value = localStorage.getItem("dpia-khoaduoc-quantri") || ""; }catch(e){}
    cq.appendChild(oq);
    var hq = el("div","dieuhuong");
    var bq = el("button","nut","Đọc phiếu đã nộp");
    bq.type = "button";
    bq.onclick = function(){ if(oq.value.trim()) tai(oq.value.trim()); };
    hq.appendChild(bq);
    cq.appendChild(hq);
    ds.appendChild(cq);
    if(oq.value.trim()) tai(oq.value.trim());
  }
}

function vanBanTongHop(hd){
  var r = [];
  r.push("C.2. DANH SACH HOAT DONG CUA DON VI");
  r.push("");
  hd.forEach(function(x, i){
    r.push((i+1) + "\t" + x.v.ten + "\t" + (x.v.chuDL||[]).join(", ") + "\t" +
      ((x.v.nhayCam&&x.v.nhayCam.length) ? "Co" : "Khong") + "\tPhieu so " + (i+1));
  });
  r.push("");
  r.push("C.3. PHIEU CHI TIET TUNG HOAT DONG");
  hd.forEach(function(x, i){
    var v = x.v;
    r.push("");
    r.push("Phieu so: " + (i+1) + " - " + v.ten);
    r.push("1. Ten hoat dong\t" + v.ten);
    r.push("2. Muc dich\t" + v.mucDich);
    r.push("3. Du lieu cua ai va so luong\t" + (v.chuDL||[]).join(", ") + "; khoang " + v.soNam + " nguoi/nam; dang luu " + v.soLuu);
    r.push("4. Co tre em\t" + v.treEm);
    r.push("5. Du lieu co ban thu thap\t" + (v.truong||[]).filter(function(t){ return !laNhayCam(t); }).join(", "));
    r.push("6. Du lieu nhay cam thu thap\t" + ((v.truong||[]).filter(laNhayCam).join(", ") || "Khong") +
      ((v.nhayCam&&v.nhayCam.length) ? " (" + v.nhayCam.map(function(y){return "Diem "+y;}).join(", ") + ")" : ""));
    r.push("7. Nguon va cach thu thap\t" + (v.nguon||[]).join(", "));
    r.push("8. Thong bao va su dong y\t" + v.dongY + (v.bieuMau ? "; " + v.bieuMau : ""));
    r.push("9. Noi luu\t" + (v.noiLuu||[]).join(", "));
    r.push("10. Ai duoc xem, sua\t" + (v.aiXem||[]).join(", ") + (v.soNguoi ? " (" + v.soNguoi + " nguoi)" : ""));
    r.push("11. Chia se cho ai\tTrong BV: " + (v.trongBV||[]).join(", ") + ". Ngoai BV: " + v.ngoaiBV + ". Ra nuoc ngoai: " + v.nuocNgoai);
    r.push("12. Luu bao lau, xoa huy\t" + v.luuLau + (v.luuGhi ? "; " + v.luuGhi : ""));
    r.push("13. Bien phap bao ve\t" + (v.baoVe||[]).join(", "));
    r.push("14. Ghi chu\t" + (v.ghiChu || "Khong") + " [Nguoi khai: " + x.nguoi + "]");
  });
  return r.join("\n");
}
function laNhayCam(t){
  for(var i=0;i<TRUONG.length;i++) if(TRUONG[i].t === t) return !!TRUONG[i].ns;
  return false;
}

/* ===================== KHUNG ĐIỀU HƯỚNG ===================== */

function dieuHuong(lui, toi, kiemTra, loi, nhanToi){
  var w = el("div","dieuhuong");
  if(lui >= 0){
    var b1 = el("button","nut phu","Quay lại");
    b1.type = "button";
    b1.onclick = function(){ di(lui); };
    w.appendChild(b1);
  }
  var b2 = el("button","nut", nhanToi || "Tiếp tục");
  b2.type = "button";
  b2.onclick = function(){
    if(kiemTra && !kiemTra()){
      var cu = w.parentNode.querySelector(".bao.canhLoi");
      if(cu) cu.remove();
      var e = el("div","bao canhLoi");
      e.textContent = loi || "Còn thiếu thông tin.";
      w.parentNode.insertBefore(e, w);
      return;
    }
    di(toi);
  };
  w.appendChild(b2);
  return w;
}

function capNhatThanh(){
  var b = cacBuoc();
  var t = document.getElementById("thanh");
  if(t) t.style.width = Math.round(S.buoc / Math.max(1, b.length-1) * 100) + "%";
  veTrangThai();
}

function ve(){
  var m = document.getElementById("man");
  m.innerHTML = "";
  if(location.hash === "#tong-hop"){
    var t = document.getElementById("thanh");
    if(t) t.style.width = "100%";
    document.getElementById("trangthai").textContent = "Trang gộp";
    manTongHop(m);
    chan(m);
    return;
  }
  var b = cacBuoc();
  var cur = b[Math.min(S.buoc, b.length-1)];
  if(cur.k === "mo") manMo(m);
  else if(cur.k === "nguoi") manNguoi(m);
  else if(cur.k === "chon") manChon(m);
  else if(cur.k === "phieu") manPhieu(m, cur.id, S.chon.indexOf(cur.id) + 1);
  else manXong(m);
  capNhatThanh();
  chan(m);
}
function chan(m){
  var c = el("div","chan");
  c.innerHTML = "Phiếu nội bộ của Bệnh viện Truyền máu Huyết học. Chỉ mô tả loại thông tin, không ghi dữ liệu cá nhân thật. " +
    "Căn cứ: Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15, Nghị định số 356/2025/NĐ-CP, Tờ trình số 71/TTr-CNTT ngày 11/11/2026.";
  var x = el("div");
  x.style.marginTop = ".6rem";
  var b = el("button","lienket","Xóa bản nháp trên máy này");
  b.type = "button";
  b.onclick = function(){
    try{ localStorage.removeItem(KHOA_LUU); }catch(e){}
    S = {nguoi:{hoTen:"",chucDanh:"",boPhan:""}, chon:[], khac:[], phieu:{}, buoc:0, maPhieu:taoMa()};
    daNop = false;
    ve();
  };
  x.appendChild(b);
  c.appendChild(x);
  m.appendChild(c);
}

/* ===================== KHỞI ĐỘNG ===================== */

doc();
ve();
window.addEventListener("hashchange", ve);
</script>
